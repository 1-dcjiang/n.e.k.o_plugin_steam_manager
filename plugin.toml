[plugin]
id = "steam_manager"
name = "Steam管理"
description = "让 YUI 管理本地 Steam 客户端与游戏库，并充当游戏助手：查询客户端状态、列出已安装游戏、按名称或 AppID 启动游戏；截取当前游戏画面、后台监控行为时间线、汇总局面供 YUI 给出建议；玩家可显式授权 YUI 接管键鼠代为操作。安全边界：只读本地库元数据，键鼠接管默认关闭且仅作用于前台游戏窗口，不读取账号凭据。何时用：用户说'Steam 开着吗/我 Steam 里有什么游戏/打开/启动 <游戏>/现在游戏什么情况/截个图看看/帮我盯着游戏/让 YUI 接管/你来玩/停止接管'等 Steam 与游戏相关请求时。"
short_description = "Steam 游戏库管理 + 游戏助手：查库、启动、截屏读局、行为跟踪、可授权 YUI 代打（默认关闭）"
keywords = ["steam", "游戏", "游戏库", "启动", "launch", "appid", "library", "库", "客户端", "game", "截图", "capture", "监控", "watch", "接管", "control", "操作", "辅助", "建议", "助手", "游戏助手", "代打"]
version = "0.2.1"
type = "plugin"
entry = "plugin.plugins.steam_manager:SteamManagerPlugin"

[plugin.author]
name = "起诉人"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.guide]]
id = "quickstart"
title = "使用说明"
entry = "docs/guide.md"
