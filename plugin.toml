[plugin]
id = "steam_manager"
name = "Steam管理"
description = "让 YUI 管理本地 Steam 客户端与游戏库，并充当游戏助手与 Steam 账号助手：查询客户端状态、列出已安装游戏、按名称或 AppID 启动游戏；截取当前游戏画面、后台监控行为时间线、汇总局面供 YUI 给出建议；玩家可显式授权 YUI 接管键鼠代为操作。v0.3.0 新增账户信息、好友列表、回复好友、价格与促销查询、打开任意游戏。v0.3.1 修复游戏库/好友分批、监控线程与帧清理。v0.3.2 新增凭证配置三模式（skip/yui/auto）。v0.4.1 安全与稳定性修复：不再自动探测浏览器 Cookie（仅手动配置）；凭证改用 Windows DPAPI 加密存于 %LOCALAPPDATA%\\N.E.K.O\\steam_manager；HTTP 429/5xx 自动重试并提示部分失败；游戏窗口标题可配置；Unicode 文本输入、鼠标坐标钳制；PNG 写入失败回退 BMP 并清理旧帧。v0.4.2 修复 64 位 INPUT 结构体尺寸导致 SendInput 无效、Win32 句柄签名截断、多显示器虚拟桌面坐标、帧监控线程重复启动、帧清理单文件 stat 失败中断、WinError 异常捕获错误、无 TEMP 时帧目录落到当前工作目录，并在打包规则中排除凭证文件。v0.4.3 修复按 AppID 打开时只扫描前 200 个游戏、凭证验证失败仍落盘，并将好友发送改为精确昵称/SteamID 匹配，拒绝纯数字子串猜人。v0.4.4 子串匹配与无 Key 直发 SteamID 增加二次确认；好友部分失败提示保留到成功结果；凭证配置改为部分成功不报整体失败；消息 500 字上限落地；未安装游戏打开商店页前需确认。何时用：用户说'Steam 开着吗/我 Steam 里有什么游戏/打开/启动 <游戏>/现在游戏什么情况/截个图看看/帮我盯着游戏/让 YUI 接管/你来玩/停止接管/我的 Steam 账号/好友列表/XX 在不在线/给好友发消息/回复好友/XX 游戏多少钱/有没有打折/打开其他游戏/配置 Steam'等 Steam 与游戏相关请求时。"
short_description = "Steam 游戏库/账号/好友/价格助手 + 截图读局与代打；凭证 DPAPI 加密、手动配置、429/5xx 重试、64 位输入与多屏修复"
keywords = ["steam", "游戏", "游戏库", "启动", "launch", "appid", "library", "库", "客户端", "game", "截图", "capture", "监控", "watch", "接管", "control", "操作", "辅助", "建议", "助手", "游戏助手", "代打", "账号", "account", "好友", "friend", "消息", "message", "价格", "price", "促销", "折扣", "特惠", "promotion", "steam community", "商店"]
version = "0.4.4"
type = "plugin"
entry = "plugin.plugins.steam_manager:SteamManagerPlugin"

[plugin.author]
name = "起诉人"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.guide]]
id = "quickstart"
title = "使用说明"
entry = "docs/guide.md"
