[plugin]
id = "steam_manager"
name = "Steam管理"
description = "让 YUI 管理本地 Steam 客户端与游戏库：查询客户端是否运行、列出已安装游戏（名称/AppID/占用空间/状态）、按名称或 AppID 启动游戏。只读本地库元数据，启动游戏需用户明确指令，不读取账号凭据。"
short_description = "Steam 游戏库查询与启动：检测客户端、列出游戏、一键启动"
keywords = ["steam", "游戏", "游戏库", "启动", "launch", "appid", "library", "库", "客户端", "game"]
version = "0.1.0"
type = "plugin"
entry = "plugin.plugins.steam_manager:SteamManagerPlugin"

[plugin.author]
name = "起诉人"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.guide]]
id = "quickstart"
title = "使用说明"
entry = "docs/guide.md"
