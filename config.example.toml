[steam]
# 游戏助手优先查找的窗口标题片段（不区分大小写）。
# 玩其他游戏时改成对应窗口标题，例如 "factorio"、"terraria"。
# 配置键存在且留空时不做 PrintWindow 直抓，只截取进程匹配的前台窗口；
# 若 game_process 也为空，则拒绝截图/监控/接管，避免截取任意前台窗口（含聊天/密码管理器）。
game_window_title = "civilization vi"

# 可选：进一步要求窗口进程名精确匹配（Windows 下不区分大小写），降低标题误匹配。
# 切换游戏时建议一并修改；缺省空串保持只按标题与内置进程黑名单识别。
# v0.4.15 起只填这一项、标题留空也可用：接管/监控按该进程的可见窗口找目标。
game_process = ""
# 示例：game_process = "factorio.exe"

# 可选：true 时所有好友发送都必须用户界面的 6 位确认码，包括精确昵称/SteamID。
# 缺省 false，保持原有的仅风险分支确认行为。
require_friend_confirm = false
